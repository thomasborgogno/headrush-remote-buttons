name: Deploy bookmarklet page

on:
  push:
    branches: [main]
    # Solo quando cambia qualcosa che finisce nel sito: la pagina (pages/) e tutto ciò da cui si costruisce
    # remote.js (src/, build). Altrimenti una modifica a src/ non verrebbe mai pubblicata.
    paths:
      - 'pages/**'
      - 'src/**'
      - 'scripts/**'
      - 'vite.bookmarklet.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - id: deployment
        uses: actions/deploy-pages@v4
